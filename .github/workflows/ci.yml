name: Nexo360 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests, Coverage & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend --ignore-scripts

      - name: Run backend tests with LCOV coverage
        env:
          NODE_ENV: test
        run: npm run test:coverage --prefix backend

      - name: Audit backend production dependencies
        run: npm audit --prefix backend --audit-level=high --omit=dev

      - name: Upload backend LCOV coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-lcov
          path: backend/coverage/lcov.info
          if-no-files-found: error

  frontend:
    name: Frontend Tests, Build & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts

      - name: Run frontend tests
        run: npm test --prefix frontend

      - name: Build frontend bundle (Vite)
        run: npm run build --prefix frontend

      - name: Audit frontend production dependencies
        run: npm audit --prefix frontend --audit-level=high --omit=dev

  docker-compose-check:
    name: Validate Production Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate docker-compose.prod.yml syntax & interpolation
        env:
          MONGO_INITDB_ROOT_USERNAME: ci_root_user
          MONGO_INITDB_ROOT_PASSWORD: ci_root_password_not_for_prod_123
          MONGO_APP_USER: ci_nexo360_app
          MONGO_APP_PASSWORD: ci_app_password_not_for_prod_123
          JWT_SECRET: ci_dummy_jwt_secret_key_with_at_least_32_characters
          FRONTEND_URL: https://nexo360.example.invalid
        run: docker compose -f docker-compose.prod.yml config --quiet

  sonarqube:
    name: SonarQube Scan
    needs: [backend, frontend, docker-compose-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download backend LCOV coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-lcov
          path: backend/coverage

      - name: Check SonarQube configuration
        id: check-sonar
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning title=SonarQube Not Configured::BLOQUEADO POR CONFIGURACIÓN: El secreto SONAR_TOKEN no está configurado en el repositorio GitHub. El análisis estático de SonarCloud/SonarQube queda suspendido a la espera de credenciales institucionales autorizadas."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run SonarQube analysis
        if: steps.check-sonar.outputs.has_token == 'true'
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
