# Configuración del Proyecto SonarQube para Nexo360 (Duoc UC - Sede Alameda)
sonar.organization=crissdavid484
sonar.projectKey=CrissDavid484_Nexo360
sonar.projectName=Nexo360
sonar.projectVersion=1.0

# Rutas de código fuente (Frontend y Backend)
sonar.sources=backend, frontend/src
sonar.exclusions=**/node_modules/**, **/dist/**, **/build/**, **/*.test.js, **/*.test.mjs, **/*.spec.js, **/tests/**, **/graphify-out/**, **/.agents/**, **/.playwright/**, **/.playwright-cli/**

# Codificación de caracteres y estándares
sonar.sourceEncoding=UTF-8
sonar.javascript.environments=browser, node
