# Configuración del Proyecto SonarQube para Nexo360 (Duoc UC - Sede Alameda)
sonar.organization=crissdavid484
sonar.projectKey=CrissDavid484_Nexo360
sonar.projectName=Nexo360
sonar.projectVersion=1.0

# Rutas de código fuente y pruebas (Frontend y Backend)
sonar.sources=backend/controllers,backend/models,backend/routes,backend/services,backend/utils,backend/server.js,frontend/src
sonar.tests=backend/tests,frontend/src/tests
sonar.test.inclusions=**/*.test.js,**/*.test.mjs,**/*.spec.js,**/tests/**

# Cobertura LCOV generada por node --test --experimental-test-coverage
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Exclusiones generales, de cobertura y de duplicación (CPD)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.js,**/*.test.mjs,**/*.spec.js,**/tests/**,backend/tests/**,frontend/src/tests/**,**/graphify-out/**,**/.agents/**,**/.playwright/**,**/.playwright-cli/**,**/mongo-init.js
sonar.coverage.exclusions=**/*.test.js,**/*.test.mjs,**/*.spec.js,**/tests/**,backend/tests/**,frontend/src/tests/**,**/scripts/**,**/data/**,**/mongo-init.js,frontend/**
sonar.cpd.exclusions=**/*.test.js,**/*.test.mjs,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,**/tests/**,backend/tests/**,frontend/src/tests/**,**/data/**,**/seedUsers.json,**/infrastructureCatalog.json,frontend/src/data/**,**/mock*.js

# Codificación de caracteres y estándares
sonar.sourceEncoding=UTF-8
sonar.javascript.environments=browser, node
